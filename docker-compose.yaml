services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shortlink_saas
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  backend:
    image: spiritsocks/url-shortener-backend:latest
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: shortlink_saas
      JWT_SECRET: ${JWT_SECRET}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-https://linxie.ru/profile}
      FRONTEND_URL: ${FRONTEND_URL:-https://linxie.ru}
      APP_DOMAIN: ${APP_DOMAIN:-linxie.ru}
      BASE_URL: ${BASE_URL:-https://linxie.ru}
    expose:
      - "8080"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: spiritsocks/url-shortener-frontend:latest
    environment:
      PORT: "80"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: shortlink_saas
      JWT_SECRET: ${JWT_SECRET}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-https://linxie.ru/profile}
      FRONTEND_URL: ${FRONTEND_URL:-https://linxie.ru}
      APP_DOMAIN: ${APP_DOMAIN:-linxie.ru}
      BASE_URL: ${BASE_URL:-https://linxie.ru}
    expose:
      - "80"
    depends_on:
      - db
    restart: unless-stopped

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  caddy_data:
  caddy_config:
